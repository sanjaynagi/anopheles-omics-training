# Snakemake environment for the course Codespace (RNA-Seq-Pop v2.3.0 and AmpSeeker v0.7.0).
#
# Snakemake 7.32.4 is the version both workflows' CI uses (9.x breaks RNA-Seq-Pop v2.3.0).
# `conda` is included because `snakemake --use-conda` still builds each rule's own conda
# environment. .devcontainer/setup.sh installs this and activates it in every terminal.
#
#   pixi install --manifest-path workflows/pixi.toml
#   pixi run --manifest-path workflows/pixi.toml snakemake --version

[workspace]
name = "anopheles-omics-training-workflows"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.11.*"
snakemake-minimal = "7.32.4.*"
pulp = "<2.8"
pandas = "*"
graphviz = "*"
conda = "*"
# for running the module notebooks' Python in the codespace
ipykernel = "*"
scikit-allel = "1.3.13.*"
statsmodels = "*"
plotly = "*"
openpyxl = "*"
