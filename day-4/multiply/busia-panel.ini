# multiply design file for module 4.2 of the course
# "Anopheles Omics: from gene expression to field assays".
#
# A small Illumina amplicon panel for the four Busia (Uganda) sweep loci found on
# Day 3, plus Vgsc kdr and Cyp4j5 as East African controls.
#
# multiply is third-party software by Jason A. Hendry:
#   https://github.com/JasonAHendry/multiply
#   Hendry JA et al. (2023) bioRxiv, doi:10.1101/2023.02.06.527333
#
# Usage, from the root of a cloned multiply repository:
#   cp busia-panel.ini      designs/
#   cp busia-panel.bed      designs/beds/
#   multiply download -g AnophelesGambiae     # once, ~250 MB
#   multiply pipeline -d designs/busia-panel.ini

[Sample]
genome = AnophelesGambiae

[Regions]
bed = designs/beds/busia-panel.bed

[Primers]
# Keep this False. multiply's `blast` step matches each BLAST hit back to the
# recorded primer start position, and tailed primers no longer align there, so
# every on-target amplicon is missed and the pipeline stops. Design the
# locus-specific primers first, then add the Illumina adapter tails to the 5'
# ends of the ordering table afterwards. The Ag-vampIR tails are:
#   F: ACACTCTTTCCCTACACGACGCTCTTCCGATCT
#   R: TCGGCATTCCTGCTGAACCGCTCTTCCGATCT
include_tails = False

[Amplicons]
# Short amplicons, so 2 x 150 bp reads cover each one end to end.
# Ag-vampIR itself used 190-250 bp with mprimer.
min_size_bp = 150
max_size_bp = 250
primer3_settings = default, stringent, relaxed

[Output]
name = busia-panel
primer_code = bp
